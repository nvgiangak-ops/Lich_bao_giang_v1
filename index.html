<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lịch báo giảng</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif:wght@600;700&display=swap">
<style>
/* =========================================================
   LỊCH BÁO GIẢNG — giao diện
   Tông màu: mực xanh (sổ báo giảng), bút đỏ (duyệt/cảnh báo),
   nền giấy lạnh; màu theo khối lớp 6–9.
   ========================================================= */
:root {
  --bg: #f1f4f8;
  --surface: #ffffff;
  --surface-2: #eef1f6;
  --surface-3: #e3e8f0;
  --ink: #16203a;
  --ink-2: #3a4560;
  --muted: #626e87;
  --line: #d9dfe9;
  --line-2: #c2cad9;
  --accent: #1d4f91;
  --accent-hover: #163f76;
  --accent-ink: #ffffff;
  --accent-soft: #e2ebf7;
  --red: #b3261e;
  --red-soft: #fbe8e6;
  --green: #1b6f45;
  --green-soft: #e0f1e7;
  --amber: #8a5300;
  --amber-soft: #fcefd6;
  --k6-bg: #dcf0ec; --k6-fg: #0d574e;
  --k7-bg: #eee5f8; --k7-fg: #5b2c83;
  --k8-bg: #fbecd4; --k8-fg: #7a4500;
  --k9-bg: #e0e9f7; --k9-fg: #1b4a88;
  --kx-bg: #eceff4; --kx-fg: #3a4560;
  --overlay: rgba(12, 18, 32, .48);
  --shadow: 0 1px 2px rgba(22, 32, 58, .06), 0 6px 20px rgba(22, 32, 58, .07);
  --paper: #f7f9fc;
  --paper-line: rgba(29, 79, 145, .08);
  --paper-line-2: rgba(29, 79, 145, .17);
  --margin-red: rgba(179, 38, 30, .42);
  --r: 12px;
  --r-sm: 8px;
  --f-ui: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --f-serif: 'Noto Serif', 'Times New Roman', Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1422; --surface: #161f32; --surface-2: #1c2740; --surface-3: #25324f;
    --ink: #e6eaf3; --ink-2: #c3cad9; --muted: #98a3ba; --line: #29354f; --line-2: #3a4867;
    --accent: #86b4f0; --accent-hover: #a3c7f5; --accent-ink: #0e1422; --accent-soft: #1e3050;
    --red: #f2958b; --red-soft: #3b1e20; --green: #74d1a2; --green-soft: #15332a; --amber: #f0bd66; --amber-soft: #3a2c14;
    --k6-bg: #133a35; --k6-fg: #86dccf; --k7-bg: #2e2142; --k7-fg: #d2adf2; --k8-bg: #3a2c14; --k8-fg: #f0bd66;
    --k9-bg: #1e3050; --k9-fg: #a3c7f5; --kx-bg: #25324f; --kx-fg: #c3cad9;
    --overlay: rgba(0, 0, 0, .6);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .3);
    --paper: #111a2b; --paper-line: rgba(134, 180, 240, .07); --paper-line-2: rgba(134, 180, 240, .14); --margin-red: rgba(242, 149, 139, .35);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1422; --surface: #161f32; --surface-2: #1c2740; --surface-3: #25324f;
  --ink: #e6eaf3; --ink-2: #c3cad9; --muted: #98a3ba; --line: #29354f; --line-2: #3a4867;
  --accent: #86b4f0; --accent-hover: #a3c7f5; --accent-ink: #0e1422; --accent-soft: #1e3050;
  --red: #f2958b; --red-soft: #3b1e20; --green: #74d1a2; --green-soft: #15332a; --amber: #f0bd66; --amber-soft: #3a2c14;
  --k6-bg: #133a35; --k6-fg: #86dccf; --k7-bg: #2e2142; --k7-fg: #d2adf2; --k8-bg: #3a2c14; --k8-fg: #f0bd66;
  --k9-bg: #1e3050; --k9-fg: #a3c7f5; --kx-bg: #25324f; --kx-fg: #c3cad9;
  --overlay: rgba(0, 0, 0, .6);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .3);
  --paper: #111a2b; --paper-line: rgba(134, 180, 240, .07); --paper-line-2: rgba(134, 180, 240, .14); --margin-red: rgba(242, 149, 139, .35);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body {
  margin: 0; color: var(--ink); font-family: var(--f-ui); font-size: 14.5px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
h1, h2, h3, h4 { margin: 0; line-height: 1.25; text-wrap: balance; }
h2 { font-size: 20px; font-weight: 700; }
h3 { font-size: 16px; font-weight: 650; }
p { margin: 0; }
a { color: var(--accent); }
small, .small { font-size: 12.5px; }
.muted { color: var(--muted); }
.serif { font-family: var(--f-serif); }
.num { font-variant-numeric: tabular-nums; }
.nowrap { white-space: nowrap; }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ic.lg { width: 22px; height: 22px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- controls ---------- */
.btn {
  font: inherit; font-size: 14px; font-weight: 550; line-height: 1.2;
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 8px 14px; min-height: 36px; border-radius: var(--r-sm);
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
  cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s;
}
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { color: var(--red); border-color: var(--line-2); }
.btn.danger:hover { background: var(--red-soft); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { font-size: 13px; padding: 5px 10px; min-height: 30px; }
.icon-btn {
  display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: var(--r-sm);
  border: 1px solid transparent; background: transparent; color: var(--ink-2); cursor: pointer; flex: none;
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn.sm { width: 28px; height: 28px; }
input, select, textarea {
  font: inherit; font-size: 14px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 7px 10px; min-height: 36px; width: 100%;
}
textarea { min-height: 70px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input[type="checkbox"] { width: 16px; height: 16px; min-height: 0; accent-color: var(--accent); }
input[type="file"] { padding: 6px; }
label.fld { display: grid; gap: 5px; font-size: 13px; font-weight: 550; color: var(--ink-2); }
label.fld > span small { font-weight: 400; color: var(--muted); }
.chk { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.row.end { justify-content: flex-end; }
.spacer { flex: 1; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.stack { display: grid; gap: 14px; }
.stack-sm { display: grid; gap: 8px; }
.stack > *, .stack-sm > *, .tkb-grid > *, .imp > *, .dash > *, .modal-body > *, .set-grid > *, .subj-grid > *, .grid-2 > *, .grid-3 > * { min-width: 0; }

.pill {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; line-height: 1.2;
  padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap;
}
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.p-ok { background: var(--green-soft); color: var(--green); }
.p-warn { background: var(--amber-soft); color: var(--amber); }
.p-err { background: var(--red-soft); color: var(--red); }
.p-info { background: var(--accent-soft); color: var(--accent); }
.p-muted { background: var(--surface-2); color: var(--muted); }
.chip { display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
.k6 { background: var(--k6-bg); color: var(--k6-fg); }
.k7 { background: var(--k7-bg); color: var(--k7-fg); }
.k8 { background: var(--k8-bg); color: var(--k8-fg); }
.k9 { background: var(--k9-bg); color: var(--k9-fg); }
.kx { background: var(--kx-bg); color: var(--kx-fg); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.card-h { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.card-h h3 { flex: 1; min-width: 180px; }
.card-b { padding: 16px; }
.card-b.flush { padding: 0; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.note { font-size: 13px; color: var(--muted); }
.callout { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--r-sm); font-size: 13.5px; }
.callout.warn { background: var(--amber-soft); color: var(--amber); }
.callout.err { background: var(--red-soft); color: var(--red); }
.callout.info { background: var(--accent-soft); color: var(--accent); }
.callout.ok { background: var(--green-soft); color: var(--green); }
.callout .ic { margin-top: 1px; }
.callout b { font-weight: 650; }

/* ---------- shell ---------- */
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 72px; }
.wrap-x { max-width: 1240px; margin: 0 auto; padding-inline: 16px; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.topbar-in { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 11px; min-width: 0; flex: 1; }
.brand-mark { width: 36px; height: 36px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.brand-mark svg { width: 22px; height: 22px; }
.brand-name { font-family: var(--f-serif); font-weight: 700; font-size: 17px; line-height: 1.15; }
.brand-sub { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.sync { font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
.sync.saving::before { background: var(--amber); }
.sync.err { color: var(--red); }
.sync.err::before { background: var(--red); }
.brand-name { white-space: nowrap; }
@media (max-width: 640px) {
  .brand-sub { display: none; }
  .sync { font-size: 0; gap: 0; }
  .topbar-in { gap: 8px; }
  .page-h h2 { font-size: 21px; }
}
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  font: inherit; font-size: 14px; font-weight: 550; color: var(--muted); background: none; border: 0; cursor: pointer;
  display: inline-flex; align-items: center; gap: 7px; padding: 10px 12px 11px; border-bottom: 2.5px solid transparent; white-space: nowrap; position: relative;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tab .badge { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); position: absolute; top: 9px; right: 4px; }
.page-h { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; margin-bottom: 18px; }
.page-h > div:first-child { flex: 1; min-width: 220px; display: grid; gap: 4px; }
.page-h h2 { font-family: var(--f-serif); font-size: 24px; }

/* ---------- login (giấy ô li) ---------- */
.login {
  min-height: 100vh; display: grid; place-items: center; padding: 28px 16px;
  background-color: var(--paper);
  background-image:
    linear-gradient(90deg, transparent calc(8% - 1px), var(--margin-red) calc(8% - 1px), var(--margin-red) calc(8% + 1px), transparent calc(8% + 1px)),
    linear-gradient(var(--paper-line-2) 1px, transparent 1px),
    linear-gradient(90deg, var(--paper-line-2) 1px, transparent 1px),
    linear-gradient(var(--paper-line) 1px, transparent 1px);
  background-size: 100% 100%, 36px 36px, 36px 36px, 9px 9px;
}
.login-card { width: min(440px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 28px 24px; display: grid; gap: 18px; }
.login-card.wide { width: min(760px, 100%); }
.login-head { display: grid; gap: 6px; }
.login-head .brand-mark { width: 44px; height: 44px; margin-bottom: 6px; }
.login-head h1 { font-family: var(--f-serif); font-size: 26px; }
.login-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.login-opt { border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; align-content: start; }
.login-opt h3 { display: flex; align-items: center; gap: 8px; }
.err-text { color: var(--red); font-size: 13px; min-height: 18px; }

/* ---------- tổng quan ---------- */
.dash { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .dash { grid-template-columns: 1fr; } }
.today-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px; }
.today-h .big { font-family: var(--f-serif); font-size: 22px; font-weight: 700; }
.tbl.wide { min-width: 560px; }
.next { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 16px; align-items: center; padding: 16px; border-radius: var(--r); background: var(--accent-soft); color: var(--accent); }
.next .time { font-family: var(--f-serif); font-size: 30px; font-weight: 700; line-height: 1; grid-row: span 2; font-variant-numeric: tabular-nums; }
.next b { color: var(--ink); font-size: 15px; }
.next span { color: var(--ink-2); font-size: 13px; }
.lesson-list { display: grid; }
.lesson {
  display: grid; grid-template-columns: 88px 64px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  padding: 10px 16px; border-top: 1px solid var(--line);
}
.lesson:first-child { border-top: 0; }
.lesson .t { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); line-height: 1.3; }
.lesson .t b { color: var(--ink); font-size: 14px; display: block; }
.lesson .nm { min-width: 0; }
.lesson .nm div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lesson.done { opacity: .55; }
.lesson.now { background: var(--accent-soft); }
.lesson.off .nm { text-decoration: line-through; color: var(--muted); }
@media (max-width: 560px) { .lesson { grid-template-columns: 70px 58px minmax(0, 1fr); } .lesson > :last-child { grid-column: 3; justify-self: start; } }
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); }
.stat { padding: 12px 16px; display: grid; gap: 2px; border-left: 1px solid var(--line); }
.stat:first-child { border-left: 0; }
.stat b { font-size: 22px; font-variant-numeric: tabular-nums; font-family: var(--f-serif); }
.stat span { font-size: 12.5px; color: var(--muted); }
.todo { display: grid; }
.todo-i { display: flex; gap: 10px; align-items: flex-start; padding: 11px 16px; border-top: 1px solid var(--line); font-size: 13.5px; }
.todo-i:first-child { border-top: 0; }
.todo-i .ic { margin-top: 2px; }
.todo-i.err .ic { color: var(--red); }
.todo-i.warn .ic { color: var(--amber); }
.todo-i.ok .ic { color: var(--green); }
.todo-i > div { flex: 1; min-width: 0; }

/* ---------- bảng chung ---------- */
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .02em; padding: 9px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.tbl td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.c, .tbl th.c { text-align: center; }
.tbl td.r, .tbl th.r { text-align: right; }
.tbl input, .tbl select { min-height: 32px; padding: 5px 8px; font-size: 13.5px; }
.bar { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; min-width: 80px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

/* ---------- báo giảng ---------- */
.weekbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; margin-bottom: 12px; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.week-nav { display: flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 4px; }
.week-title { display: grid; padding: 2px 10px; min-width: 150px; text-align: center; }
.week-title b { font-family: var(--f-serif); font-size: 20px; line-height: 1.1; }
.week-title span { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.week-sel { width: auto; min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r-sm); overflow: hidden; }
.seg button { font: inherit; font-size: 13px; font-weight: 550; background: var(--surface); color: var(--muted); border: 0; padding: 7px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
details.menu { position: relative; }
details.menu > summary { list-style: none; }
details.menu > summary::-webkit-details-marker { display: none; }
.menu-pop {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 15; min-width: 250px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 6px; display: grid;
}
.menu-pop button { font: inherit; font-size: 14px; text-align: left; background: none; border: 0; color: var(--ink); padding: 9px 10px; border-radius: 7px; display: flex; gap: 10px; align-items: center; cursor: pointer; }
.menu-pop button:hover { background: var(--surface-2); }
.menu-pop hr { border: 0; border-top: 1px solid var(--line); margin: 5px 4px; }
@media (max-width: 560px) { .menu-pop { right: auto; left: 0; } }

.day { margin-bottom: 14px; }
.day-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 11px 16px; border-bottom: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r) var(--r) 0 0; }
.day-h b { font-size: 15px; }
.day-h .date { font-variant-numeric: tabular-nums; color: var(--ink-2); }
.day.today .day-h { background: var(--accent-soft); }
.day.today .day-h b { color: var(--accent); }
.bg-head, .bg-row {
  display: grid; gap: 8px 10px; align-items: center; padding: 8px 16px;
  grid-template-columns: 112px 78px 128px 74px minmax(180px, 1fr) 170px 140px 112px 30px;
  grid-template-areas: "gio lop mon ppct ten dd gc tt x";
}
.bg-head { font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: .03em; text-transform: uppercase; padding-block: 8px; border-bottom: 1px solid var(--line); }
.bg-row { border-bottom: 1px solid var(--line); }
.bg-row:last-child { border-bottom: 0; }
.bg-row .lbl { display: none; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.bg-row label { display: grid; gap: 3px; min-width: 0; }

  const nghiDai = c.ngayNghi.filter(x => x.boTuan);
  while (ds.length < c.soTuan && guard++ < 200) {
    const cuoi = D.add(m, 5);
    if (!nghiDai.some(x => x.tu <= m && (x.den || x.tu) >= cuoi)) ds.push(m);

function tuanCua(ngay) {
  const ds = dsTuan();
  for (let i = 0; i < ds.length; i++) if (ngay >= ds[i] && ngay <= D.add(ds[i], 6)) return i + 1;

        bai.push({ tiet: t, tuan: tuanArr.length === so.length ? tuanArr[k] : (tuanArr[0] ?? null), hocKy, chuDe, ten: ch, ghiChu: cot.ghiChu >= 0 ? (L[cot.ghiChu] || '') : '' });
      });
      dem = Math.max(dem, ...so);
    }
  }
  bai.sort((a, b) => a.tiet - b.tiet);
  const maxT = bai.length ? bai[bai.length - 1].tiet : 0;
  bai.forEach(x => { if (!x.hocKy) x.hocKy = x.tuan ? (x.tuan >= hk2 ? 'II' : 'I') : (x.tiet <= Math.ceil(maxT * 18 / 35) ? 'I' : 'II'); });

  if (!ten) ten = tenMonTuFile(tenFile);
  let khoi = (ten.match(/(\d{1,2})$/) || tieuDe.match(/(?:l[ớo]p|kh[ốo]i)\s*(\d{1,2})\b/i) || [])[1] || '';

/** Phần tên bài dùng để so các tiết của cùng một bài: bỏ (T1), (TT), – Tiết 2, dấu chấm cuối; coi mọi loại gạch ngang là một */
function gocTenBai(s) {
  let t = String(s || '').trim();
  for (let i = 0; i < 3; i++) t = t.replace(/\s*[.;,]+\s*$/, '').replace(/\s*[(\[]\s*(tt|tiếp theo|tiếp|t\s*\d+|tiết\s*\d+[^)\]]*)\s*[)\]]\s*$/i, '').replace(/\s*[–—-]\s*tiết\s*\d+(\s*\/\s*\d+)?\s*$/i, '').trim();

function kiemTraPPCT(bai, tongTieuDe, hkTong) {
  const cb = [];
  const dem = new Map(); bai.forEach(b => dem.set(b.tiet, (dem.get(b.tiet) || 0) + 1));
  const trung = [...dem].filter(([, v]) => v > 1).map(([k]) => k);
  if (trung.length) cb.push({ muc: 'err', nd: `Trùng số tiết: ${trung.join(', ')}` });
  const max = bai.reduce((a, b) => Math.max(a, b.tiet), 0), thieu = [];
  for (let i = 1; i <= max; i++) if (!dem.has(i)) thieu.push(i);
  if (thieu.length) cb.push({ muc: 'err', nd: `Thiếu tiết số: ${thieu.slice(0, 20).join(', ')}${thieu.length > 20 ? '…' : ''}` });
  if (tongTieuDe && tongTieuDe !== bai.length) cb.push({ muc: 'warn', nd: `Tiêu đề ghi cả năm ${tongTieuDe} tiết nhưng bảng có ${bai.length} tiết` });
  const nhom = new Map();
  bai.forEach(b => {
    const m = b.ten.match(/^B[àa]i\s*(\d+[a-zđ]?)\s*[.:\-–]?\s*(.*)$/i); if (!m) return;
    const goc = gocTenBai(m[2]);
    const k = m[1].toLowerCase(); if (!nhom.has(k)) nhom.set(k, []); nhom.get(k).push({ tiet: b.tiet, goc });
  });
  const soKhop = s => boDau(s).replace(/[–—-]/g, '-').replace(/\s*-\s*/g, ' - ').replace(/\s+/g, ' ');
  for (const [k, arr] of nhom) {
    if (new Set(arr.map(x => soKhop(x.goc))).size > 1) cb.push({ muc: 'warn', nd: `Bài ${k} có tên không thống nhất: ` + arr.map(x => `tiết ${x.tiet} “${x.goc}”`).join(' · ') });
  }
  if (hkTong) ['I', 'II'].forEach(k => { const n = bai.filter(b => b.hocKy === k).length; if (hkTong[k] != null && n && n !== hkTong[k]) cb.push({ muc: 'warn', nd: `Học kỳ ${k}: phần đầu file ghi ${hkTong[k]} tiết nhưng bảng có ${n} tiết` }); });
  bai.forEach(b => {
    const m = boDau(b.ten).match(/\b(giua|cuoi)\s+(hoc\s+)?k[yi]\s+(ii|i)\b/);
    if (m && b.hocKy && (m[3] === 'ii' ? 'II' : 'I') !== b.hocKy) cb.push({ muc: 'warn', nd: `Tiết ${b.tiet} thuộc học kỳ ${b.hocKy} nhưng tên bài ghi “${b.ten}” — có thể gõ nhầm học kỳ` });
  });
  let truoc = 0;
  for (const b of bai) { if (b.tuan && b.tuan < truoc) { cb.push({ muc: 'warn', nd: `Cột tuần không tăng dần ở tiết ${b.tiet} (tuần ${b.tuan} sau tuần ${truoc})` }); break; } if (b.tuan) truoc = b.tuan; }
  const rong = bai.filter(b => !b.ten).map(b => b.tiet); if (rong.length) cb.push({ muc: 'err', nd: `Tiết chưa có tên bài: ${rong.join(', ')}` });
  return cb;
}

const MODEL_DU_PHONG = ['gemini-3.8-flash', 'gemini-3.5-flash-lite', 'gemini-3.5-flash', 'gemini-flash-latest', 'gemini-3.1-flash-lite', 'gemini-2.5-flash'];
const LOI_TAM_THOI = new Set([408, 429, 500, 502, 503, 504]);
/** Thông điệp lỗi Gemini dễ hiểu */
function loiGeminiDeHieu(code, msg) {
  if (code === 400 && /api key/i.test(msg)) return 'Khóa Gemini API không hợp lệ. Kiểm tra lại khóa (Cài đặt › Nhận dạng ảnh bằng AI, hoặc menu trong Google Sheet).';
  if (code === 403) return 'Khóa Gemini API không có quyền dùng mô hình này hoặc đã bị chặn. Tạo khóa mới tại aistudio.google.com/apikey.';
  if (code === 400) return 'Gemini không nhận ảnh này (' + (msg || code) + '). Thử ảnh khác hoặc nhập tay.';
  return 'Gemini báo lỗi ' + code + (msg ? ': ' + msg : '');
}

const catJSON = s => { s = String(s || '').replace(/```(?:json)?/gi, ''); const a = s.indexOf('{'), b = s.lastIndexOf('}'); return a >= 0 && b > a ? s.slice(a, b + 1) : s; };
/** Chuẩn hóa kết quả AI → {ngayApDung, o:[{buoi,thu,tiet,lop,phong}]} */
function chuanHoaAI(kq) {
  kq = kq || {};
  const ds = Array.isArray(kq.o) ? kq.o : Array.isArray(kq.slots) ? kq.slots : Array.isArray(kq) ? kq : [];
  const o = [];
  for (const x of ds) {
    let buoi = boDau(x.buoi || '');
    buoi = /^(s|sang)\b/.test(buoi) ? 'S' : /^(c|chieu)\b/.test(buoi) ? 'C' : '?';
    let tiet = String(x.tiet ?? '');
    const mt = tiet.match(/^\s*([SC])\s*(\d)/i); if (mt) { buoi = mt[1].toUpperCase(); tiet = mt[2]; }
    tiet = parseInt(tiet.replace(/\D/g, ''), 10);
    const thu = parseInt(String(x.thu ?? '').replace(/\D/g, ''), 10);
    const lop = String(x.lop || '').trim().toUpperCase();
    if (!lop || !(thu >= 2 && thu <= 7) || !(tiet >= 1 && tiet <= 5)) continue;
    o.push({ buoi, thu, tiet, lop, phong: String(x.phong || '').trim().toUpperCase() });
  }
  return { ngayApDung: D.hopLe(kq.ngayApDung) ? kq.ngayApDung : '', tieuDe: kq.tieuDe || '', giaoVien: kq.giaoVien || '', o };
}
/** Gọi Gemini trực tiếp từ trình duyệt. Dùng thử: khóa lưu trên máy này. Máy chủ: khóa do máy chủ gửi cho admin đã đăng nhập. */
async function goiGemini(dataUrl, key, model, baoTienDo, gioiHan = 120e3) {
  const m = String(dataUrl).match(/^data:(image\/[\w+.-]+);base64,(.+)$/);
  if (!m) throw new Error('Ảnh không hợp lệ');
  const daThu = [], batDau = Date.now();
  const body = JSON.stringify({ contents: [{ role: 'user', parts: [{ inline_data: { mime_type: m[1], data: m[2] } }, { text: PROMPT_TKB }] }], generationConfig: { responseMimeType: 'application/json' } });
  for (const md of [...new Set([model, ...MODEL_DU_PHONG].filter(Boolean))]) {
    for (let lan = 1; lan <= 2; lan++) {
      if (Date.now() - batDau > gioiHan) break;
      if (baoTienDo) baoTienDo(`Đang thử ${md}${lan > 1 ? ' (lần ' + lan + ')' : ''}…`);
      let res;
      try {
        res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(md)}:generateContent`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key }, body });
      } catch (e) { const x = new Error('Trình duyệt không kết nối được Gemini (kiểm tra mạng).'); x.mang = true; throw x; }
      const j = await res.json().catch(() => ({}));
      const msg = (j.error && j.error.message) || '';
      if (res.ok) {
        const txt = ((((j.candidates || [])[0] || {}).content || {}).parts || []).map(p => p.text || '').join('');
        try { return { model: md, daThu, ketQua: JSON.parse(catJSON(txt)) }; }
        catch { daThu.push(md + ': trả kết quả không đọc được'); break; }
      }
      if (res.status === 404 || /not found|not supported/i.test(msg)) { daThu.push(md + ': không có'); break; }
      if (LOI_TAM_THOI.has(res.status)) { daThu.push(md + ': ' + res.status); if (lan === 1) { await new Promise(r => setTimeout(r, 2500)); continue; } break; }
      const x = new Error(loiGeminiDeHieu(res.status, msg)); x.maHttp = res.status; throw x;
    }
  }
  const moHinh = [...new Set(daThu.map(x => x.split(':')[0]))];
  const e = new Error('Gemini đang quá tải: đã thử ' + moHinh.length + ' mô hình (' + moHinh.join(', ') + '), mỗi mô hình tối đa 2 lần. Chờ vài phút rồi bấm "Thử lại", hoặc nhập tay trên lưới.');
  e.quaTai = true; throw e;
}

    if (this.mayChu) { await this.goi('changePw', { old: cu, new: moi }); return; }
    const rec = LS.get('lbg_pw'); if (!rec || await sha256(rec.salt + cu) !== rec.hash) throw new Error('Mật khẩu hiện tại không đúng.');
    await this.taoMatKhauLocal(moi);
  },

  /* ---- dữ liệu ---- */
  async taiDuLieu() { return this.mayChu ? this.goi('load') : (LS.get('lbg_db') || dbTrong()); },
  async luu(kind, payload) {
    if (!this.mayChu) {
      if (!LS.set('lbg_db', DB)) throw new Error('Bộ nhớ trình duyệt đã đầy hoặc bị chặn. Hãy sao lưu JSON rồi chuyển sang dùng máy chủ.');
      return;
    }
    const map = { config: ['saveConfig', 'config'], mon: ['saveMon', 'mon'], monXoa: ['deleteMon', 'id'], tkb: ['saveTkb', 'ver'], tkbXoa: ['deleteTkb', 'id'], tuan: ['saveTuan', 'tuan'], tuanXoa: ['deleteTuan', 'so'], log: ['addLog', 'entry'] };
    if (kind === 'tuan') payload = { ...payload, dong: payload.dong.map(r => ({ ...r, monTen: tenMon(r.mon), gio: gioTiet(r.buoi, r.tiet) })) };
    const [action, key] = map[kind]; return this.goi(action, { [key]: payload });
  },
  async khoiPhuc(db) {
    if (this.mayChu) return this.goi('restore', { db });
    if (!LS.set('lbg_db', db)) throw new Error('Không ghi được dữ liệu vào trình duyệt.');
  },
  async luuAnh(id, dataUrl) {
    if (this.mayChu) { const r = await this.goi('saveImage', { id, dataUrl }); this.anh.set(r.anhId, dataUrl); return r.anhId; }
    const nho = await nenAnh(dataUrl, 1100, 0.72);
    if (!LS.set('lbg_img_' + id, nho)) throw new Error('Bộ nhớ trình duyệt đầy, không lưu được ảnh gốc.');
    this.anh.set(id, nho); return id;
  },
  async layAnh(anhId) {
    if (!anhId) return null;
    if (this.anh.has(anhId)) return this.anh.get(anhId);
    const url = this.mayChu ? (await this.goi('getImage', { id: anhId })).dataUrl : LS.get('lbg_img_' + anhId);
    if (url) this.anh.set(anhId, url); return url;
  },
  /** Khóa Gemini từ máy chủ (chỉ trả cho admin đã đăng nhập), giữ trong bộ nhớ, không lưu xuống trình duyệt */
  async layKhoaAI() {
    if (this.khoaAI && this.khoaAI.url === this.url) return this.khoaAI;
    const r = await this.goi('aiKey');
    this.khoaAI = { key: (r && r.key) || '', model: (r && r.model) || '', url: this.url };
    return this.khoaAI;
  },
  async docAnhAI(dataUrl, baoTienDo) {
    if (this.mayChu) {
      // 1) Trình duyệt gọi Gemini trực tiếp (giống bản dùng thử): Gemini hay báo "quá tải" với yêu cầu từ máy chủ Apps Script.
      // 2) Không được thì nhờ máy chủ đọc. Máy chủ bản cũ (chưa có thao tác aiKey) thì đi thẳng bước 2.
      let loiTD = null, k = null;
      try { k = await this.layKhoaAI(); } catch (e) { if (!this.token) throw e; console.warn('Máy chủ chưa hỗ trợ aiKey:', e.message); }
      if (k && k.key) {
        try { return { ...(await goiGemini(dataUrl, k.key, k.model, baoTienDo, 90e3)), qua: 'trình duyệt' }; }
        catch (e) { if (e.maHttp === 400 || e.maHttp === 403) this.khoaAI = null; if (e.maHttp === 400) throw e; loiTD = e; }
      }
      if (baoTienDo) baoTienDo(loiTD ? 'trình duyệt chưa đọc được, đang nhờ máy chủ…' : 'đang nhờ máy chủ đọc…');
      try { return { ...(await this.goi('aiParse', { dataUrl })), qua: 'máy chủ' }; }
      catch (e) {
        if (!loiTD) throw e;
        const bo = m => String(m).replace(/\s*Chờ vài phút.*$/, '');
        const g = new Error('Trình duyệt: ' + bo(loiTD.message) + ' Máy chủ: ' + bo(e.message) + ' Chờ vài phút rồi bấm "Thử lại", hoặc nhập tay trên lưới.');
        g.quaTai = !!(loiTD.quaTai || /quá tải|503/.test(e.message)); throw g;
      }
    }
    const g = LS.get('lbg_gemini') || {};
    if (!g.key) throw new Error('Chưa có khóa Gemini API. Vào Cài đặt → "Nhận dạng ảnh bằng AI" để nhập khóa, hoặc nhập tay trên lưới.');
    return goiGemini(dataUrl, g.key, g.model, baoTienDo);
  }
};

function vTongQuan() {
  const c = CFG(), hom = D.today(), nThuc = tuanCua(hom), n = tuanHienTai();
  const bg = (S.draft && S.draft.so === n) ? S.draft : baoGiangTuan(n);
  const rowsHom = nThuc > 0 ? bg.rows.filter(r => r.ngay === hom) : [];
  const now = D.gioPhut();
  const gioR = r => (c.gio[r.buoi] || [])[r.tiet - 1] || ['', ''];
  let tiep = null;
  for (const r of rowsHom) { if (r.tt === 'nghi') continue; const g = gioR(r); if (now <= g[1]) { tiep = { r, g, dang: now >= g[0] }; break; } }
  let ke = null;
  if (!tiep) { const sau = bg.rows.filter(r => r.ngay > hom && r.tt !== 'nghi'); if (sau.length) ke = { ngay: sau[0].ngay, rows: sau.filter(r => r.ngay === sau[0].ngay) }; }
  const phut = hhmm => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };
  const lessonHtml = r => {
    const g = gioR(r);
    const cls = r.tt === 'nghi' ? 'off' : (r.ngay === hom && now > g[1] ? 'done' : (r.ngay === hom && now >= g[0] ? 'now' : ''));
    const pill = r.tt !== 'day' ? `<span class="pill ${r.tt === 'nghi' ? 'p-err' : 'p-warn'}">${TT[r.tt]}</span>` : cls === 'now' ? '<span class="pill p-info"><span class="dot"></span>Đang dạy</span>' : cls === 'done' ? '<span class="pill p-muted">Xong</span>' : '';
    return `<div class="lesson ${cls}"><div class="t"><b>${g[0]}</b>${TEN_BUOI[r.buoi]} · tiết ${r.tiet}</div><div><span class="chip ${lopKhoi(r.lop)}">${esc(r.lop)}</span></div>
      <div class="nm"><div>${r.tietPPCT ? `<b>Tiết ${r.tietPPCT}:</b> ` : ''}${esc(r.ten || (r.tt === 'nghi' ? 'Nghỉ' : '—'))}</div><small class="muted">${esc(tenMon(r.mon))}${r.phong ? ' · P. ' + esc(r.phong) : ''}${r.dd ? ' · ' + esc(r.dd) : ''}</small></div><div>${pill}</div></div>`;
  };
  let homNayHtml;
  if (nThuc <= 0) homNayHtml = `<div class="empty">${ic('info', 'lg')}<div>Hôm nay không thuộc tuần học nào (trước/sau năm học hoặc tuần nghỉ).</div></div>`;
  else if (!rowsHom.length) homNayHtml = `<div class="empty">${ic('check', 'lg')}<div>Hôm nay không có tiết dạy.</div></div>`;
  else homNayHtml = `<div class="lesson-list">${rowsHom.map(lessonHtml).join('')}</div>`;
  let nextHtml = '';
  if (tiep) {
    const con = phut(tiep.g[0]) - phut(now);
    nextHtml = `<div class="next"><div class="time">${tiep.g[0]}</div><b>${tiep.dang ? 'Đang dạy' : 'Tiết tiếp theo'}: ${esc(tiep.r.lop)} · ${TEN_BUOI[tiep.r.buoi]} tiết ${tiep.r.tiet}</b>
      <span>${tiep.r.tietPPCT ? 'Tiết PPCT ' + tiep.r.tietPPCT + ' — ' : ''}${esc(tiep.r.ten || 'chưa có tên bài')}${!tiep.dang && con > 0 ? ` · còn ${con >= 60 ? Math.floor(con / 60) + ' giờ ' : ''}${con % 60} phút` : ''}</span></div>`;
  } else if (ke) {
    nextHtml = `<div class="next"><div class="time">${gioR(ke.rows[0])[0]}</div><b>Ngày dạy tiếp theo: ${TEN_THU[D.thu(ke.ngay)]} ${D.vn(ke.ngay)}</b><span>${ke.rows.length} tiết · bắt đầu với ${esc(ke.rows[0].lop)}</span></div>`;
  }
  const soDay = bg.rows.filter(r => r.tt !== 'nghi').length;
  const soLop = new Set(bg.rows.map(r => r.lop)).size;
  const tt = S.dirty && S.draft && S.draft.so === n ? 'Chưa lưu' : bg.trangThai === 'luu' ? 'Đã lưu' : bg.trangThai === 'lech' ? 'Lệch TKB' : 'Nháp';
  const td = tienDo(n);
  const tdHtml = td.length ? `<div class="tbl-wrap"><table class="tbl wide"><thead><tr><th>Lớp</th><th>Môn</th><th class="r">Đã dạy</th><th>Tiến độ</th><th class="r">Theo PPCT</th><th class="r">Chênh lệch</th></tr></thead><tbody>
    ${td.map(x => `<tr><td><span class="chip ${lopKhoi(x.lop)}">${esc(x.lop)}</span></td><td>${esc(tenMon(x.mon))}</td><td class="r num">${x.daDay}${x.tong ? '/' + x.tong : ''}</td>
      <td>${x.tong ? `<div class="bar"><i style="width:${Math.min(100, Math.round(x.daDay / x.tong * 100))}%"></i></div>` : '<span class="note">chưa có PPCT</span>'}</td>
      <td class="r num">${x.keHoach == null ? '—' : x.keHoach}</td>
      <td class="r">${x.lech == null ? '<span class="note">—</span>' : x.lech === 0 ? '<span class="pill p-ok">Đúng</span>' : x.lech < 0 ? `<span class="pill p-err">Chậm ${-x.lech}</span>` : `<span class="pill p-warn">Nhanh ${x.lech}</span>`}</td></tr>`).join('')}
    </tbody></table></div>` : `<div class="empty">Chưa có dữ liệu tiến độ.</div>`;

      rows += `<td>${s ? `<button class="slot ${lopKhoi(s.lop)}" data-act="o-tkb" data-v="${v.id}" data-k="${thu}-${t}" title="${esc((mo && mo.mon ? tenMon(mo.mon) + ' · ' : '') + 'bấm để đổi môn tiết này')}"><b>${esc(s.lop)}</b>${s.phong ? `<small>${esc(s.phong)}</small>` : ''}${nhanMon ? `<span class="ov">${mo.rieng ? '✎ ' : ''}${esc(nhanMon)}</span>` : ''}</button>` : ''}</td>`;

function truocCua(v) {
  let best = null;

}

function oSangMap(slots) { const m = {}; (slots || []).forEach(s => { m[khoaO(s)] = oText(s); }); return m; }
function tachO(txt) {
  const t = String(txt || '').trim(); if (!t) return null;
  const m = t.match(/^([^\s(]+)\s*(?:\(([^)]*)\)|\s+(\S+))?/);
  return m ? { lop: m[1].toUpperCase(), phong: (m[2] || m[3] || '').trim().toUpperCase() } : null;
}
function mapSangSlots(map, goc) {
  const out = [];
  Object.entries(map).forEach(([k, v]) => {
    const p = tachO(v); if (!p) return; const [thu, tiet] = k.split('-').map(Number);
    const cu = (goc || []).find(s => s.thu === thu && s.tiet === tiet && s.lop === p.lop);
    out.push({ thu, tiet, lop: p.lop, phong: p.phong, mon: cu ? cu.mon || '' : '' });
  });
  return out.sort((a, b) => a.thu - b.thu || a.tiet - b.tiet);
}

async function luuTKBMoi(w, st) {
  const apDung = $('#imp-ngay', w).value;
  if (!D.hopLe(apDung)) { toast('Chọn ngày áp dụng.', 'err'); return false; }
  const ten = $('#imp-ten', w).value.trim() || ('TKB từ ' + D.vn(apDung)); const ghiChu = $('#imp-gc', w).value.trim();
  const viec = [];
  for (const b of ['S', 'C']) {
    if (!st.bat[b]) continue;
    const cu = tkbHieuLuc(b, apDung);
    const slots = mapSangSlots(st.luoi[b], cu ? cu.slots : []);
    const d = soSanhTKB(cu ? cu.slots : [], slots);
    if (cu && d.giong) continue;
    if (!cu && !slots.length) continue;
    viec.push({ b, cu, slots, d });
  }
  if (!viec.length) { toast('Không có thay đổi nào so với TKB đang áp dụng từ ngày này.', 'err'); return false; }
  const xoaHet = viec.filter(x => !x.slots.length);
  if (xoaHet.length && !(await xacNhan(`Buổi <b>${xoaHet.map(x => TEN_BUOI[x.b].toLowerCase()).join(', ')}</b> sẽ không còn tiết nào từ ${D.vn(apDung)}. Tiếp tục?`, { nhanOk: 'Vẫn lưu', nguyHiem: true }))) return false;
  const sauNay = viec.map(x => DB.tkb.find(v => v.buoi === x.b && v.apDung > apDung)).filter(Boolean);
  dangTai(true, 'Đang lưu TKB…');
  try {
    let anhId = '';
    if (st.anh) { try { anhId = await Store.luuAnh(uid(), st.anh); } catch (e) { toast('Không lưu được ảnh gốc: ' + e.message, 'err'); } }
    const tuanCu = Object.keys(DB.tuan).map(Number).filter(so => baoGiangTuan(so).trangThai === 'lech');
    for (const x of viec) {
      const ver = { id: uid(), buoi: x.b, apDung, ten, ghiChu, anhId, taoLuc: new Date().toISOString(), slots: x.slots };
      DB.tkb.push(ver); daThayDoi();
      try { await luu('tkb', ver); } catch (e) { DB.tkb = DB.tkb.filter(v => v.id !== ver.id); daThayDoi(); throw e; }
      const anhHuong = Object.keys(DB.tuan).map(Number).filter(so => !tuanCu.includes(so) && baoGiangTuan(so).trangThai === 'lech').sort((a, b) => a - b);
      await ghiLog('tkb', `${x.cu ? 'Cập nhật' : 'Khởi tạo'} TKB buổi ${TEN_BUOI[x.b].toLowerCase()} · áp dụng từ ${D.vn(apDung)} · ${x.cu ? tomTatDiff(x.d) : x.slots.length + ' tiết'}`,
        { buoi: x.b, apDung, ten, ghiChu, verId: ver.id, truocId: x.cu ? x.cu.id : '', anhId, nguon: st.nguon, theoLop: x.d.theoLop, doi: x.d.doi.filter(z => z.nhe), truoc: x.d.truoc, sau: x.d.sau, tuanAnhHuong: anhHuong });
      if (anhHuong.length) toast(`Tuần ${anhHuong.join(', ')} đã lưu bị lệch với TKB mới — mở Báo giảng để cập nhật.`, 'err');
    }
  } finally { dangTai(false); }
  if (sauNay.length) toast(`Lưu ý: đã có TKB áp dụng từ ${sauNay.map(v => D.vn(v.apDung)).join(', ')} nên bản mới chỉ có hiệu lực đến trước ngày đó.`);
  toast('Đã lưu thời khóa biểu mới.', 'ok');
  S.tkbNgay = apDung >= D.today() ? apDung : null; render();
}

/** So tên môn không phân biệt dấu, chữ "lớp", "khối", "môn": "Tin học lớp 9" ≡ "Tin học 9" */
const khoaMon = s => boDau(s).replace(/\b(mon|lop|khoi)\b/g, ' ').replace(/[^a-z0-9]+/g, ' ').trim();
const gocMon = s => khoaMon(s).replace(/\s*\d+$/, '').trim();

function timMonTrung(ten, khoi) {
  const k = khoaMon(ten);
  let m = DB.mon.find(x => khoaMon(x.ten) === k || x.id === slug(ten));
  if (m) return m.id;
  const pc = khoi && CFG().phanCong.khoi[khoi], mp = pc && monTheoId(pc);
  if (mp && gocMon(mp.ten) === gocMon(ten)) return mp.id;
  m = DB.mon.find(x => khoi && String(x.khoi) === String(khoi) && gocMon(x.ten) === gocMon(ten));
  return m ? m.id : '';
}

async function luuMon(mon, cu) {
  if (cu) DB.mon = DB.mon.map(m => m.id === mon.id ? mon : m); else DB.mon.push(mon);
  daThayDoi();
  try { await luu('mon', mon); } catch (e) { if (cu) DB.mon = DB.mon.map(m => m.id === mon.id ? cu : m); else DB.mon = DB.mon.filter(m => m.id !== mon.id); daThayDoi(); throw e; }
}
function soSanhPPCT(a, b) {
  const ma = new Map(a.map(x => [x.tiet, x])), mb = new Map(b.map(x => [x.tiet, x])); const out = [];
  mb.forEach((x, t) => { const o = ma.get(t); if (!o) out.push({ tiet: t, cu: '', moi: x.ten }); else if (o.ten !== x.ten || (o.tuan ?? '') !== (x.tuan ?? '') || o.ghiChu !== x.ghiChu) out.push({ tiet: t, cu: o.ten, moi: x.ten }); });
  ma.forEach((x, t) => { if (!mb.has(t)) out.push({ tiet: t, cu: x.ten, moi: '' }); });

}

async function luuCaiDat() {
  const cu = CFG(); const c = clone(DB.config || {});
  const v = id => ($('#' + id) ? $('#' + id).value.trim() : '');
  Object.assign(c, { truong: v('cf-truong'), to: v('cf-to'), gv: v('cf-gv'), namHoc: v('cf-namhoc'), diaDanh: v('cf-diadanh'), ddMacDinh: v('cf-dd'), khoGiay: v('cf-kho') || 'ngang' });
  const t1 = v('cf-tuan1'); if (!D.hopLe(t1)) throw new Error('Ngày bắt đầu tuần 1 không hợp lệ.');
  c.ngayTuan1 = D.thuHai(t1);
  const st = parseInt(v('cf-sotuan'), 10), hk2 = parseInt(v('cf-hk2'), 10);
  if (!(st >= 1 && st <= 60)) throw new Error('Số tuần học phải từ 1 đến 60.');
  if (!(hk2 >= 1 && hk2 <= st)) throw new Error('Tuần bắt đầu HK II phải nằm trong số tuần học.');
  c.soTuan = st; c.hk2TuTuan = hk2;
  c.gio = { S: [], C: [] };
  for (const b of ['S', 'C']) for (let t = 1; t <= 5; t++) {
    const bd = v(`g-${b}-${t}-bd`), kt = v(`g-${b}-${t}-kt`);
    if (!/^\d{2}:\d{2}$/.test(bd) || !/^\d{2}:\d{2}$/.test(kt) || bd >= kt) throw new Error(`Giờ tiết ${t} buổi ${TEN_BUOI[b].toLowerCase()} chưa hợp lệ.`);
    c.gio[b].push([bd, kt]);
  }
  for (const x of S.nghiTam) { if (!D.hopLe(x.tu)) throw new Error('Có ngày nghỉ chưa chọn ngày.'); if (!D.hopLe(x.den) || x.den < x.tu) x.den = x.tu; if (!x.ten) x.ten = 'Nghỉ'; }
  c.ngayNghi = clone(S.nghiTam).sort((a, b) => a.tu.localeCompare(b.tu));
  c.phanCong = cu.phanCong;
  const nhan = { truong: 'tên trường', to: 'tổ', gv: 'giáo viên', namHoc: 'năm học', diaDanh: 'địa danh', ddMacDinh: 'ĐDDH mặc định', khoGiay: 'khổ giấy', ngayTuan1: 'ngày bắt đầu tuần 1', soTuan: 'số tuần', hk2TuTuan: 'tuần bắt đầu HK II' };
  const thayDoi = Object.keys(nhan).filter(k => String(cu[k] ?? '') !== String(c[k] ?? '')).map(k => `${nhan[k]}: “${cu[k] ?? ''}” → “${c[k]}”`);
  if (JSON.stringify(cu.gio) !== JSON.stringify(c.gio)) thayDoi.push('giờ học từng tiết');
  if (JSON.stringify(cu.ngayNghi) !== JSON.stringify(c.ngayNghi)) thayDoi.push(`ngày nghỉ (${c.ngayNghi.length} mục)`);
  const tm = LS.get('lbg_theme') || '', tmMoi = v('cf-theme'); if (tm !== tmMoi) { LS.set('lbg_theme', tmMoi); apDungGiaoDien(); }
  if (!thayDoi.length) { toast('Không có thay đổi.'); return; }
  const doiTuan = cu.ngayTuan1 !== c.ngayTuan1 || JSON.stringify(cu.ngayNghi.filter(x => x.boTuan)) !== JSON.stringify(c.ngayNghi.filter(x => x.boTuan));
  DB.config = c; daThayDoi();
  await luu('config', c);
  if (doiTuan) await danhSoLaiTuanDaLuu();
  await ghiLog('caidat', 'Cập nhật cài đặt: ' + thayDoi.map(x => x.split(':')[0]).join(', '), { thayDoi });
  S.nghiTam = null; veKhung(); render(); toast('Đã lưu cài đặt.', 'ok');
}
/** Khi đổi ngày bắt đầu/tuần nghỉ: gán lại số tuần cho các tuần đã lưu theo ngày thực */
async function danhSoLaiTuanDaLuu() {
  const cu = Object.values(DB.tuan); const moi = {}; const doi = [];
  for (const t of cu) {
    const ngay = t.batDau || (t.dong[0] && t.dong[0].ngay); const so = ngay ? tuanCua(ngay) : t.so;
    if (so > 0 && so !== t.so) { doi.push([t.so, so]); moi[so] = { ...t, so }; } else moi[t.so] = t;
  }
  if (!doi.length) return;
  DB.tuan = moi; daThayDoi();
  for (const [a, b] of doi) { await luu('tuanXoa', a); await luu('tuan', DB.tuan[b]); }
  await ghiLog('bg', `Đánh số lại ${doi.length} tuần đã lưu do đổi lịch năm học`, { thayDoi: doi.map(([a, b]) => `Tuần ${a} → tuần ${b}`) });
}

const COT_BG = [['Thứ, ngày', 10], ['Buổi', 5], ['Tiết', 4], ['Thời gian', 9], ['Lớp', 10], ['Môn', 8], ['Tiết PPCT', 5], ['Tên bài dạy', 27], ['Đồ dùng dạy học', 14], ['Ghi chú', 8]];
const duLieuTuan = n => (S.draft && S.draft.so === n) ? S.draft : baoGiangTuan(n);
const tenFileTuan = (n, ext) => `LichBaoGiang_Tuan${pad(n)}_${D.vn(ngayTuan(n)).replace(/\//g, '-')}.${ext}`;
/** 9 cột sau cột "Thứ, ngày" */
function oXuat(r) {
  const nghi = r.tt === 'nghi';
  return [TEN_BUOI[r.buoi], r.tiet, gioTiet(r.buoi, r.tiet), r.lop + (r.phong ? ` (${r.phong})` : ''), tenMon(r.mon) === '—' ? '' : tenMon(r.mon),
    nghi ? '' : (r.tietPPCT === '' ? '' : r.tietPPCT), nghi ? 'Nghỉ' : (r.ten || ''), nghi ? '' : (r.dd || ''),
    [r.tt === 'bu' ? 'Dạy bù' : r.tt === 'thay' ? 'Dạy thay' : '', r.gc && !(r.tt === 'bu' && r.gc === 'Dạy bù') && !(r.tt === 'thay' && r.gc === 'Dạy thay') ? r.gc : ''].filter(Boolean).join('. ')];
}
function nhomNgay(rows) {
  const out = []; rows.forEach(r => { let g = out[out.length - 1]; if (!g || g.ngay !== r.ngay) { g = { ngay: r.ngay, rows: [] }; out.push(g); } g.rows.push(r); }); return out;
}
function thongKe(rows) {
  const dem = k => rows.filter(r => r.tt === k).length;
  const day = dem('day'), nghi = dem('nghi'), bu = dem('bu'), thay = dem('thay');
  return `Tổng số tiết trong tuần: ${rows.length - nghi} tiết dạy${nghi ? `, ${nghi} tiết nghỉ` : ''}${bu ? ` (trong đó ${bu} tiết dạy bù)` : ''}${thay ? `, ${thay} tiết dạy thay` : ''}.`;
}
const dongKy = (c, n) => { const [y, m, d] = ngayTuan(n).split('-'); return `${c.diaDanh || '……………'}, ngày ${d} tháng ${m} năm ${y}`; };

/* ---------------- Word ---------------- */
async function xuatDocxTuan(n) {
  const c = CFG(), d = duLieuTuan(n), ngang = c.khoGiay !== 'doc';
  const W = ngang ? 14854 : 9922;
  const widths = COT_BG.map(x => Math.round(W * x[1] / 100));
  const hw = [Math.round(W * 0.42), W - Math.round(W * 0.42)];
  const hd = wTable(wRow(
    wCell(wP((c.truong || '').toUpperCase(), { align: 'center' }) + wP(c.to ? 'TỔ ' + c.to.toUpperCase() : '', { b: true, align: 'center' }), { w: hw[0], va: 'top' }) +
    wCell(wP('LỊCH BÁO GIẢNG', { b: true, sz: 15, align: 'center' }) + wP(`Tuần ${n} – Năm học ${c.namHoc}`, { b: true, align: 'center' }) + wP(`(Từ ngày ${D.vn(ngayTuan(n))} đến ngày ${D.vn(D.add(ngayTuan(n), 5))})`, { i: true, align: 'center' }), { w: hw[1], va: 'top' })
  ), hw, { noBorder: true });
  const gv = wP(`Giáo viên: ${c.gv || '……………………………'}`, { b: true, before: 200, after: 120 });
  let rows = wRow(COT_BG.map((x, i) => wCell(wP(x[0], { b: true, align: 'center', sz: 11 }), { w: widths[i], fill: 'EEF1F6' })).join(''), { header: true, cant: true });
  for (const g of nhomNgay(d.rows)) {
    g.rows.forEach((r, k) => {
      const v = oXuat(r);
      const nghi = r.tt === 'nghi';
      const buoiDau = k === 0 || g.rows[k - 1].buoi !== r.buoi;
      const buoiNhieu = g.rows.filter(x => x.buoi === r.buoi).length > 1;
      let cells = k === 0 ? wCell(wP(TEN_THU[D.thu(g.ngay)] + '\n' + D.vn(g.ngay), { b: true, align: 'center', sz: 11 }), { w: widths[0], vm: g.rows.length > 1 ? 'restart' : '' }) : wCell('', { w: widths[0], vm: 'continue' });
      cells += buoiDau ? wCell(wP(v[0], { align: 'center', sz: 11 }), { w: widths[1], vm: buoiNhieu ? 'restart' : '' }) : wCell('', { w: widths[1], vm: 'continue' });
      v.slice(1).forEach((x, i) => { const col = i + 2; cells += wCell(wP(String(x ?? ''), { sz: 11, align: col <= 6 ? 'center' : '', i: nghi && col === 7, b: col === 4 }), { w: widths[col] }); });
      rows += wRow(cells, { cant: true });
    });
  }
  const bang = wTable(rows, widths);
  const tk = wP(thongKe(d.rows), { i: true, before: 120 });
  const gc = d.ghiChu ? wP('Ghi chú: ' + d.ghiChu, { before: 60 }) : '';
  const sw = [Math.round(W / 3), Math.round(W / 3), W - 2 * Math.round(W / 3)];
  const ky = wTable(wRow(
    wCell(wP('DUYỆT CỦA BAN GIÁM HIỆU', { b: true, align: 'center' }), { w: sw[0], va: 'top' }) +
    wCell(wP('DUYỆT CỦA TỔ CHUYÊN MÔN', { b: true, align: 'center' }), { w: sw[1], va: 'top' }) +
    wCell(wP(dongKy(c, n), { i: true, align: 'center' }) + wP('NGƯỜI LẬP', { b: true, align: 'center' }) + wP('\n\n\n', {}) + wP(c.gv || '', { b: true, align: 'center' }), { w: sw[2], va: 'top' })
  ), sw, { noBorder: true });
  const body = hd + gv + bang + tk + gc + wP('', { after: 200 }) + ky;
  taiXuong(docxBuild(body, { ngang }), tenFileTuan(n, 'docx'));

/* ---------------- Lịch điện thoại (.ics) ---------------- */
function xuatIcs(n) {
  const d = duLieuTuan(n), c = CFG();
  const utc = (ngay, hm) => { const [y, m, dd] = ngay.split('-').map(Number), [h, mi] = hm.split(':').map(Number); const x = new Date(Date.UTC(y, m - 1, dd, h - 7, mi)); return `${x.getUTCFullYear()}${pad(x.getUTCMonth() + 1)}${pad(x.getUTCDate())}T${pad(x.getUTCHours())}${pad(x.getUTCMinutes())}00Z`; };
  const e = s => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
  const gap = line => { const out = []; let s = line; while (s.length > 60) { out.push(s.slice(0, 60)); s = ' ' + s.slice(60); } out.push(s); return out.join('\r\n'); };
  const now = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
  const ev = d.rows.filter(r => r.tt !== 'nghi').map(r => {
    const g = (c.gio[r.buoi] || [])[r.tiet - 1]; if (!g) return '';
    return ['BEGIN:VEVENT', `UID:${r.id}-${r.ngay}@lich-bao-giang`, `DTSTAMP:${now}`, `DTSTART:${utc(r.ngay, g[0])}`, `DTEND:${utc(r.ngay, g[1])}`,
      gap(`SUMMARY:${e(`${r.lop} · ${r.tietPPCT ? 'Tiết ' + r.tietPPCT + ': ' : ''}${r.ten || tenMon(r.mon)}`)}`),
      r.phong ? gap(`LOCATION:${e('Phòng ' + r.phong)}`) : '', gap(`DESCRIPTION:${e([tenMon(r.mon), TEN_BUOI[r.buoi] + ' tiết ' + r.tiet, r.dd ? 'ĐDDH: ' + r.dd : '', r.gc].filter(Boolean).join('\n'))}`),
      'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:Sắp vào tiết', 'TRIGGER:-PT10M', 'END:VALARM', 'END:VEVENT'].filter(Boolean).join('\r\n');
  }).filter(Boolean);
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Lich bao giang//VI', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', `X-WR-CALNAME:Lịch dạy tuần ${n}`, ...ev, 'END:VCALENDAR'].join('\r\n');
  taiXuong(new Blob([ics], { type: 'text/calendar;charset=utf-8' }), tenFileTuan(n, 'ics'));
  toast(`Đã tạo ${ev.length} sự kiện, có nhắc trước 10 phút. Mở file để thêm vào lịch điện thoại.`, 'ok');
}

async function doiMayChu() {

      <label class="fld"><span>URL Web App (kết thúc bằng /exec)</span><input id="mc-url" type="url" value="${esc(Store.mayChu ? Store.url : (LS.get('lbg_api') || ''))}" placeholder="https://script.google.com/macros/s/…/exec"></label>

async function khoiPhuc() {
  const f = await chonFile('.json,application/json'); if (!f) return;
  let goi; try { goi = JSON.parse(await docFile(f, 'text')); } catch { toast('File không phải JSON hợp lệ.', 'err'); return; }
  const db = goi && (goi.db || goi);
  if (!db || !db.config || !Array.isArray(db.tkb)) { toast('File không phải bản sao lưu của Lịch báo giảng.', 'err'); return; }
  if (!(await xacNhan(`Thay <b>toàn bộ</b> dữ liệu hiện tại bằng bản sao lưu ${goi.xuatLuc ? 'lúc ' + esc(thoiGianVN(goi.xuatLuc)) : ''}? (${db.tkb.length} phiên bản TKB, ${(db.mon || []).length} môn, ${Object.keys(db.tuan || {}).length} tuần đã lưu)`, { nhanOk: 'Khôi phục', nguyHiem: true }))) return;
  const moi = chuanHoaDB(db);
  dangTai(true, 'Đang khôi phục…');
  try {
    await Store.khoiPhuc(moi);
    if (!Store.mayChu && goi.anh) Object.entries(goi.anh).forEach(([id, url]) => LS.set('lbg_img_' + id, url));
    DB = moi; S.dirty = false; daThayDoi();
  } finally { dangTai(false); }
  await ghiLog('he-thong', 'Khôi phục dữ liệu từ ' + f.name, {});
  veKhung(); render(); toast('Đã khôi phục dữ liệu.', 'ok');
}

function ganSuKien() {
  document.addEventListener('click', e => {
    $$('details.menu[open]').forEach(m => { if (!m.contains(e.target) || e.target.closest('.menu-pop button')) m.open = false; });
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled || el.closest('.modal-wrap') && !ACT_TRONG_MODAL.has(el.dataset.act)) return;
    const fn = ACT[el.dataset.act]; if (!fn) return;
    Promise.resolve().then(() => fn(el, e)).catch(err => { console.error(err); dangTai(false); toast(err.message || String(err), 'err'); });
  });
  document.addEventListener('change', e => {
    const el = e.target;
    const chay = p => Promise.resolve(p).catch(err => { console.error(err); toast(err.message || String(err), 'err'); });
    if (el.closest && el.closest('.bg-row') && el.dataset.f) return suaDong(el);
    if (el.id === 'sel-tuan') return chay(chuyenTuan(+el.value));
    if (el.id === 'tkb-ngay') { S.tkbNgay = D.hopLe(el.value) ? el.value : null; return render(); }
    if (el.dataset && (el.dataset.pcKhoi !== undefined || el.dataset.pcLop !== undefined || el.dataset.pcThutu !== undefined)) return chay(doiPhanCong(el));
    if (el.dataset && el.dataset.nghi !== undefined && S.nghiTam) {
      const x = S.nghiTam[+el.dataset.nghi]; const f = el.dataset.nf; if (!x) return;
      x[f] = el.type === 'checkbox' ? el.checked : el.value;
      if (f === 'tu' && (!x.den || x.den < x.tu)) { x.den = x.tu; $('#nghi-list').innerHTML = veNghi(); }
    }
  });
  document.addEventListener('input', e => {
    const el = e.target;
    if (el.id === 'bg-ghichu' && S.draft) { S.draft.ghiChu = el.value; if (!S.dirty) { S.dirty = true; capNhatTrangThaiTuan(); } }
  });
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && S.tab === 'baogiang' && !$('#shell').hidden && !$('#modal-root').children.length) {
      e.preventDefault(); if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      setTimeout(() => luuTuan().catch(err => toast(err.message, 'err')), 30);
    }
  });
  window.addEventListener('beforeunload', e => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });
  setInterval(() => { if (S.tab === 'tongquan' && DB && !$('#shell').hidden && !$('#modal-root').children.length) render(); }, 60000);
}
